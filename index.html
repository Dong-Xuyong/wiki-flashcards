<!DOCTYPE html>

<body class="dx">
  <a class="skip-link" href="#view-root">Skip to content</a>
  <div id="app">
    <header id="topbar" class="dx-header">
      <a class="dx-home" href="/" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></a>
      <button id="back-btn" class="icon-btn hidden" aria-label="Back">&#8592;</button>
      <h1 id="topbar-title" class="dx-title">Wiki Review Cards</h1>
      <div class="dx-actions">
        <div id="topbar-status">
          <span id="topbar-meta"></span>
          <span id="sync-label" aria-live="polite"></span>
        </div>
        <button type="button" data-dong-theme-toggle aria-label="Toggle color theme"></button>
      </div>
    </header>
    <nav class="suite-nav dx-tabs" aria-label="Study sections">
      <a class="dx-tab" href="/wiki-flashcards/#/" data-suite="cards">Cards</a>

      <a class="dx-tab" href="/wiki-flashcards/insights/" data-suite="insights">Insights</a>
    </nav>
    <div id="connect" hidden>
      <button type="button" id="btn-connect">Connect GitHub to sync</button>
    </div>

    <main id="view-root" tabindex="-1">
      <div id="loading" class="dx-on-bg" role="status">Loading concepts&hellip;</div>
    </main>

    <div id="live-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="study-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

    <nav id="tabbar" aria-label="Primary navigation">
      <button type="button" data-tab="home" class="tab nav-tab active">
        <span class="tab-icon nav-icon" aria-hidden="true">&#8962;</span>
        <span>Home</span>
      </button>
      <button type="button" data-tab="library" class="tab nav-tab">
        <span class="tab-icon nav-icon" aria-hidden="true">&#9776;</span>
        <span>Library</span>
      </button>
      <button type="button" data-tab="study" class="tab nav-tab">
        <span class="tab-icon nav-icon" aria-hidden="true">&#9889;</span>
        <span>Study</span>
      </button>
      <button type="button" data-tab="analytics" class="tab nav-tab">
        <span class="tab-icon nav-icon" aria-hidden="true">&#9636;</span>
        <span>Progress</span>
      </button>
    </nav>
  </div>
  <script src="dong-ui/gh-sync.js?v=4"></script>
  <script src="agent-feed.js?v=2"></script>
  <script src="analytics.js?v=8"></script>
